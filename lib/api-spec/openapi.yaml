paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns the API process health status.
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /evaluate:
    post:
      operationId: evaluateScenario
      tags:
        - evaluation
      summary: Evaluate a relocation scenario
      description: Validates a canonical MoveWise scenario. The 200 response is the canonical activation contract; the current HTTP route returns 501 after successful validation until the deterministic engine is wired to the transport boundary.
      requestBody:
        required: true
        description: A structurally valid scenario. The server applies additional semantic refinements from @workspace/contracts at runtime.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "200":
          description: Canonical deterministic result shape reserved for transport activation; not returned by the current Phase 0 route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
        "400":
          description: The request failed canonical runtime validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidScenarioInputError"
        "501":
          description: The request is valid, but the decision engine is not active at the HTTP boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEngineUnavailableError"
webhooks: {}
