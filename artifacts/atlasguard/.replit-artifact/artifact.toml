kind = "web"
previewPath = "/"
title = "AtlasGuard"
version = "1.0.0"
id = "artifacts/atlasguard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24734

[services.development]
run = "cd /home/runner/workspace/.worktrees/atlasguard-mvp && pnpm --filter @workspace/atlasguard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/atlasguard", "run", "build" ]
publicDir = ".worktrees/atlasguard-mvp/artifacts/atlasguard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24734"
BASE_PATH = "/"
